# 5G Core & IMS hands-on training program — course catalogue.
# NOTE: lab specifics (project IDs, VM names, host IP addresses, auth keys)
# are deliberately omitted from this public data file. Only standard-protocol
# and educational information is published.

program:
  courses: 8
  cells: 736
  hours: "~40"
  tracks: 4

courses:
  - num: "00"
    title: "Lab Setup"
    track: "setup"
    tag: "Prerequisite"
    focus: >
      Build the whole lab in your own cloud project — a VM, a 5G Standalone
      core, NAT, the kernel GTP module (with the toolchain pitfall pre-solved),
      a simulated RAN, a test subscriber, and a three-line smoke test.
    cells: 41
    meta: ["build-your-own", "low-cost cloud VM"]
    topics: ["Cloud VM", "Open5GS install", "GTP / NAT", "UERANSIM", "First attach"]
    prereq: ""

  - num: "01"
    title: "5G Core Operations in Practice"
    track: "core"
    tag: "5G Core"
    focus: >
      Operate, monitor and troubleshoot a live 5G Standalone core: network
      functions, PDU sessions, registration, reading the dashboard, and
      localizing faults by reference point.
    cells: 99
    meta: ["~4 h", "hands-on"]
    topics: ["NF lifecycle", "PDU sessions", "5G-AKA", "N1/N2/N3/N4", "Fault localization"]
    prereq: "Requires 00 · basic Linux + networking"

  - num: "02"
    title: "IMS Core & VoNR Procedures"
    track: "ims"
    tag: "IMS · Voice"
    focus: >
      Register and call over a live IMS core on top of 5G — a P/I/S-CSCF chain,
      an HSS, and a media relay. IMS-AKA registration, a VoNR call between two
      UEs, and every procedure proven with packet evidence.
    cells: 111
    meta: ["~4.5 h", "core lab"]
    topics: ["IMS-AKA REGISTER", "VoNR call", "Cx: UAR/MAR/SAR/LIR", "SIP + Diameter decode", "RTP / MOS", "SMS over IMS"]
    prereq: "Requires 01"

  - num: "03"
    title: "Advanced 5G Core Engineering"
    track: "core"
    tag: "5G Core"
    focus: >
      Change the network, not just watch it: network slicing end-to-end, QoS
      differentiation with Linux traffic control, TS 33.501 security hardening,
      signalling forensics via the NF discovery API, and an AI-RCA on-ramp.
    cells: 71
    meta: ["~5 h", "engineering"]
    topics: ["Network slicing", "QoS / tc shaping", "TS 33.501 security", "SUCI / ECIES", "Signalling forensics", "KPI pipeline"]
    prereq: "Requires 01 · 02 recommended"

  - num: "04"
    title: "Advanced IMS Scenarios & Service Engineering"
    track: "ims"
    tag: "IMS · Voice"
    focus: >
      The service layer above the base procedures: initial Filter Criteria and
      Application Servers, MMTEL (hold, diversion, barring, identity), transfer
      and conference, emergency calls, access continuity, interconnect, advanced
      media and charging. Half is offline reference call-flows — runs with no lab.
    cells: 119
    meta: ["~6 h", "20 call-flows"]
    topics: ["iFC / AS / ISC / Sh", "MMTEL services", "REFER / conference", "Emergency (sos)", "T-ADS / SRVCC", "ENUM / IBCF", "Rf/Ro charging"]
    prereq: "Requires 02"

  - num: "05"
    title: "Data Engineering, Analytics & ML"
    track: "data"
    tag: "Data · ML"
    focus: >
      Turn the telemetry every earlier course produces into a data-science
      lifecycle: ingestion, a feature store, analytics, visualization, and
      machine learning — anomaly detection, fault classification, and
      forecasting. Ships two notebooks: a synthetic edition that runs anywhere,
      and a live-lab edition that runs on real telemetry.
    cells: 179
    meta: ["101 + 78 cells", "~7 h + 4 h"]
    topics: ["Ingestion & feature store", "Sessionization", "TS 28.554 KPIs", "Isolation Forest", "DTW classification", "Forecasting", "MLOps"]
    prereq: "Requires 01 · 02/03 for vocabulary"

  - num: "06"
    title: "Deep, Graph & Federated ML"
    track: "data"
    tag: "Data · ML"
    focus: >
      When a deep, graph or federated method beats a classical one — and when it
      does not. CNNs/ROCKET for KPI time series, sequence models and self-attention
      for signalling ladders, graph neural nets for fault localization on the
      service-based architecture, deep anomaly detection, federated learning across
      sites, and a trust layer (conformal prediction, drift, human-in-the-loop).
    cells: 52
    meta: ["~5 h", "offline · no GPU"]
    topics: ["CNN / ROCKET", "Sequence models · attention", "Graph neural nets", "Deep anomaly detection", "Federated learning (FedAvg)", "Conformal prediction", "Drift & trust"]
    prereq: "Requires 05"

  - num: "07"
    title: "IMS Roaming & Signalling Security"
    track: "security"
    tag: "Security · Roaming"
    focus: >
      International roaming and how to defend it: the roaming architecture
      (home/visited networks, the IPX, DEA, SEPP), SS7/MAP and CAMEL flows,
      Diameter roaming (S6a), VoLTE/VoNR roaming (S8HR vs local breakout),
      5G roaming and the SEPP (N32/PRINS), signalling firewalls to GSMA guidance,
      roaming fraud detection, and operations / incident response.
    cells: 64
    meta: ["~6 h", "offline-first"]
    topics: ["Roaming architecture", "SS7 / MAP / CAMEL", "Diameter S6a", "VoLTE/VoNR roaming", "SEPP · N32 · PRINS", "Signalling firewalls", "Fraud detection", "Incident & on-call"]
    prereq: "Requires 02 (+ 01)"
