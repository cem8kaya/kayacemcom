summary: |
  I design and build software at the intersection of 5G telecommunications and artificial intelligence.
  With 15+ years of hands-on telecom experience, my projects span the full stack of modern network
  engineering: from bare-metal protocol parsers in C++ and PFCP-compliant firewalls, to multi-agent
  LLM orchestrators that diagnose 5G core faults in near-real-time. I work fluently across 3GPP
  standards, cloud infrastructure (GCP), and applied ML — grounding every project in the real
  constraints of production telecom environments.

