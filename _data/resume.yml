    highlights:
      - Architected cloud-native AI/ML solutions using Kubernetes/OpenShift and GCP Vertex AI, enabling 40% faster model deployment cycles
      - Led development of conversational AI chatbot and document analyzer system using LangGraph multi-agent orchestration
      - Designed synthetic data generation system using advanced statistical modeling (Gamma, Lognormal, Beta, Poisson distributions)
      - Implemented V2X sidelink QoS prediction models with machine learning algorithms

