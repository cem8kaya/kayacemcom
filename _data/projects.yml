# Projects data — sourced from technical portfolio (June 2026)

- title: "Open5GS AI/ML Laboratory"
  description: >
    Fully simulated 5G Standalone Core Network deployed on GCP, operated via Google Colab notebooks.
    Deploys all 7 core NFs (AMF/SMF/UPF/AUSF/UDM/PCF/NRF) with UERANSIM. Executes 8 labeled traffic
    scenarios for ML research including anomaly injection (scan, flood, Slowloris, exfiltration),
    handover simulation, PDU session lifecycle, QoS class comparison (5QI 1/8/9), and network slicing
    (SST 1/2/3). Includes full ETL pipeline and an iPhone IoT sensor (SeismoSense) feeding real
    accelerometer data over HTTP as an mMTC slice source. Key finding: documented the gtp5g kernel
    bypass that makes tcpdump/eBPF ineffective on Open5GS GTP-U data plane.
