- title: "SeismoSense — iPhone Earthquake Detector"
  description: >
    Native iOS application turning an iPhone into a fully offline seismograph using the classical
    STA/LTA (Short-Term Average / Long-Term Average) algorithm over CoreMotion accelerometer data
    at 100Hz — the same method used in professional seismology. Alert threshold calibrated at STA/LTA
    ratio ≥ 3.0. Features iOS Focus mode bypass for time-sensitive seismic alerts, background
    overnight monitoring, geolocation tagging, and a personal seismic event log. Submitted to the
    Apple App Store (bilingual: English + Turkish). Also feeds real accelerometer data into the
    Open5GS AI Lab as an mMTC IoT sensor source via HTTP POST.
  github: "https://github.com/cem8kaya/seismosense"
